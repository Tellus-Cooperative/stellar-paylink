name: Feature request
description: Propose a change or addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which user problem does it solve
      placeholder: Creators cannot tell when a link was viewed but not paid.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and acceptance criteria
      description: What should happen, and how we know it works (testable criteria).
    validations:
      required: true
  - type: checkboxes
    id: backlog
    attributes:
      label: Backlog policy
      description: Every proposal must answer these (see roadmap).
      options:
        - label: Preserves non-custody
        - label: Can be verified against network data, or explains why not
        - label: Improves forkability, or explains the tradeoff
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - P2 later
        - P1 sprint
        - P0 release blocker
    validations:
      required: true
